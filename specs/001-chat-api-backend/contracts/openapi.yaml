# SUBSTITUÍDO por specs/001-onde-esta-meu-dinheiro/contracts/openapi.yaml
openapi: 3.0.3
info:
  title: Caqui Chat API
  version: 0.1.0
paths:
  /perguntar:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntarRequest'
      responses:
        '200':
          description: Resposta factual com fontes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerguntarResponse' }
        '400': { description: Requisição inválida }
        '404': { description: Cliente não encontrado }
  /health:
    get:
      responses:
        '200': { description: Service is healthy }
  /api/v1/chat:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400': { description: Invalid request }
        '502': { description: Provider failure }
        '504': { description: Provider timeout }
components:
  schemas:
    PerguntarRequest:
      type: object
      required: [id_cliente, pergunta]
      properties:
        id_cliente: { type: string, pattern: '^C-\d{4}$' }
        pergunta: { type: string, minLength: 1, maxLength: 4000 }
    PerguntarResponse:
      type: object
      required: [resposta, fontes]
      properties:
        resposta: { type: string }
        fontes:
          type: array
          items: { type: string }
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        conversationId: { type: string, format: uuid }
        history:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Message' }
    ChatResponse:
      type: object
      required: [conversationId, message, provider, model, action]
      properties:
        conversationId: { type: string, format: uuid }
        message: { type: string }
        provider: { type: string }
        model: { type: string }
        action: { type: string, enum: [respond, human_handoff, security_handoff] }
